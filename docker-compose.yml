services:
  scanner:
    build: .
    restart: unless-stopped
    command: ["hybrid-scanner", "run", "--simulation", "--api"]
    environment:
      HYBRID_SCANNER_API_HOST: 0.0.0.0
      HYBRID_SCANNER_API_TOKEN: ${HYBRID_SCANNER_API_TOKEN:?Set HYBRID_SCANNER_API_TOKEN before docker compose up}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
