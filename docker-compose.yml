services:
  scanner:
    build: .
    restart: unless-stopped
    command: ["hybrid-scanner", "run", "--simulation", "--api"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
