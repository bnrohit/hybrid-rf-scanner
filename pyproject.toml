[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rf-scanner"
version = "2.0.1"
description = "Uncertainty-aware real-time TI mmWave + RGB-D sensor-fusion platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rohith Bommalla Naresh"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.7,<3",
  "pyserial>=3.5,<4",
  "loguru>=0.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "prometheus-client>=0.20,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "build>=1.2,<2",
  "httpx2>=2.9,<3",
]

[project.scripts]
hybrid-scanner = "hybrid_scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
